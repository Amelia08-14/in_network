# Configuration Nginx — IN NETWORK
# À adapter (domaine, chemins certbot) puis copier vers /etc/nginx/sites-available/
# Frontend (site public + /dashboard + /admin) sur le domaine principal, backend
# API sur le sous-domaine api. — reste same-site au sens des cookies (cf.
# README §2, nécessaire pour le refresh token httpOnly).

# --- Frontend (Next.js, PM2 sur le port 3000) — sert aussi /dashboard et /admin ---
server {
    listen 80;
    server_name innetwork.dz www.innetwork.dz;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- Backend API (Node/Express, PM2 sur le port 4000) ---
server {
    listen 80;
    server_name api.innetwork.dz;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Après ajout de ce fichier :
#   sudo ln -s /etc/nginx/sites-available/innetwork /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d innetwork.dz -d www.innetwork.dz -d api.innetwork.dz
# Certbot réécrira automatiquement ces blocs pour rediriger le HTTP vers HTTPS.
